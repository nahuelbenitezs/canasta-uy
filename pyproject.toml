[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canasta-etl"
version = "0.1.0"
description = "Carga y limpieza de los datos abiertos de precios al consumidor de Uruguay"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.2", "fastapi>=0.115", "requests>=2.31", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.5"]

[project.scripts]
canasta-etl = "canasta_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]  # filas de CSV de ejemplo

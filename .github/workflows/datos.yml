name: Actualizar datos

on:
  schedule:
    - cron: "37 19 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/datos.yml"
      - "pyproject.toml"
      - "scripts/**"
      - "src/canasta_etl/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch --depth 1 origin gh-pages:gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instalar
        run: |
          python -m pip install -q -e .
          npm ci --prefix web
      - name: Datos oficiales
        run: python scripts/actualizar_datos.py
      - name: Referencia nacional del SIPC
        continue-on-error: true
        run: |
          if [[ ! -f web/public/datos/recientes.json ]] && git cat-file -e gh-pages:datos/recientes.json; then
            git show gh-pages:datos/recientes.json > web/public/datos/recientes.json
          fi
          python -m canasta_etl.recientes web/public/datos
      - name: Precios online
        continue-on-error: true
        run: python -m canasta_etl.tiendas web/public/datos
      - name: Publicar
        env:
          REMOTO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publicar.sh
